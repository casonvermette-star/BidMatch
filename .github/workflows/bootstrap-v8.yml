name: Apply BidMatch V8 Cloud Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-v8.yml'

permissions:
  contents: write

jobs:
  apply-v8:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify V8 payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/v8.zip
          echo "dbc24125627b4d1911bfa769c1daf54bef4862813fb0c6ca5a885b5ea6b83350  .bootstrap/v8.zip" | sha256sum -c -

      - name: Extract and validate V8
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bidmatch-v8
          mkdir -p /tmp/bidmatch-v8
          unzip -q .bootstrap/v8.zip -d /tmp/bidmatch-v8

          SRC="/tmp/bidmatch-v8/bidmatch-ai-v8-cloud-runtime"
          test -d "$SRC"
          test -f "$SRC/package.json"
          test -f "$SRC/server.mjs"
          test -f "$SRC/data/db.json"

          node -e "const p=require('$SRC/package.json'); if(p.version !== '8.0.0') { console.error('Expected V8.0.0, found', p.version); process.exit(1); }"

          # Never allow private runtime credentials/data into the repository payload.
          test ! -e "$SRC/.env"
          test ! -e "$SRC/data/auth.json"
          test ! -e "$SRC/data/normalized-export.json"

      - name: Test V8 before replacing main
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/bidmatch-v8/bidmatch-ai-v8-cloud-runtime
          npm test

      - name: Prepare clean V8 source tree
        shell: bash
        run: |
          set -euo pipefail
          SRC="/tmp/bidmatch-v8/bidmatch-ai-v8-cloud-runtime"

          # Keep data/db.json because it is the fictional demo/test fixture required
          # by local mode and the smoke tests. Remove only private/runtime data.
          rm -f "$SRC/.env"
          rm -f "$SRC/data/auth.json" "$SRC/data/normalized-export.json"
          rm -rf "$SRC/data/uploads" "$SRC/backups"
          mkdir -p "$SRC/data/uploads" "$SRC/backups"
          touch "$SRC/data/uploads/.gitkeep" "$SRC/backups/.gitkeep"

      - name: Replace old V6 source with V8
        shell: bash
        run: |
          set -euo pipefail
          SRC="/tmp/bidmatch-v8/bidmatch-ai-v8-cloud-runtime"

          # Preserve Git metadata, the bootstrap payload, and the currently-running
          # workflow. Replace the rest of the old flattened V6 tree.
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name .bootstrap \
            -exec rm -rf {} +

          cp -a "$SRC"/. .

          # Bootstrap archive is no longer needed after V8 has been copied in.
          rm -rf .bootstrap

          # Final safety check before committing.
          test ! -e .env
          test ! -e data/auth.json
          test ! -e data/normalized-export.json
          test -f data/db.json

          node -e "const p=require('./package.json'); if(p.version !== '8.0.0') process.exit(1)"

      - name: Commit V8 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No V8 changes to commit."
            exit 0
          fi

          git commit -m "Upgrade BidMatch to V8 Cloud Runtime"
          git push origin HEAD:main
