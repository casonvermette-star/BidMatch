services:
  - type: web
    name: bidmatch-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: REQUIRE_LOGIN
        value: true
      - key: ALLOW_SELF_SIGNUP
        value: false
      - key: SECURE_COOKIES
        value: true
